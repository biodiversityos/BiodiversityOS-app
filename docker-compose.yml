services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_INDEXER_URL: ${NEXT_PUBLIC_INDEXER_URL}
        NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN}
        NEXT_PUBLIC_TESTNET_RPC_URL: ${NEXT_PUBLIC_TESTNET_RPC_URL}
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    env_file:
      - .env
    networks:
      default:
      bos:
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first and the servers bind IPv4 only, so the check fails on a
      # perfectly healthy container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  bos:
    external: true
